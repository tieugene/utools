[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "ulib"
dynamic = ["version"]
description = "uLibrary"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "TI_Eugene", email = "ti.eugene@gmail.com"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Operating System :: OS Independent",
]
dependencies = [
  "sh",
  # "libmount",
  "zstandard",
  "platformdirs",
  "sysrsync",
  "libvirt-python"
]
urls.Homepage = "https://github.com/tieugene/utools"
urls.Source = "https://github.com/tieugene/utrools"

[project.scripts]
# kitpos = "kitpos.main:main"

[tool.setuptools]
packages = ["ulib"]

[tool.setuptools.dynamic]
version = {attr = "ulib.__version__"}

[tool.pep8]
max-line-length = "120"

[tool.flake8]
max-line-length = 120

[tool.pylint]
max-line-length = 120
disable = [
  "W0511",  # `to do` keywords
]
